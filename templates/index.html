<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم الشبكة المصغرة</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #0a1526;
    color: #e6f1ff;
    min-height: 100vh;
    padding: 16px;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #13233d;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
    border: 1px solid #1e3a5f;
  }
  h1 {
    text-align: center;
    color: #4fd1c5;
    font-size: 1.35rem;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .subtitle {
    text-align: center;
    color: #7aa7c7;
    font-size: .85rem;
    margin-bottom: 18px;
  }
  .bar {
    display: block;
    background: linear-gradient(90deg,#1e3a5f,#2a4d7a);
    color: #cfe3f5;
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    font-size: .9rem;
    margin-bottom: 18px;
    border: 1px solid #2c537f;
  }
  label {
    display: block;
    color: #9ec5e8;
    font-size: .85rem;
    margin-bottom: 6px;
  }
  select, input[type="text"] {
    width: 100%;
    padding: 11px 12px;
    background: #1b2f4d;
    color: #e6f1ff;
    border: 1px solid #2c537f;
    border-radius: 8px;
    font-size: .95rem;
    font-family: inherit;
    margin-bottom: 12px;
    outline: none;
    transition: border-color .2s;
  }
  select:focus, input:focus { border-color: #4fd1c5; }
  input::placeholder { color: #6f8ba8; }
  button {
    display: block;
    margin: 6px auto 18px;
    padding: 11px 28px;
    background: #4fd1c5;
    color: #0a1526;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }
  button:hover { background: #38b2ac; transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  .result-title {
    text-align: center;
    color: #4fd1c5;
    font-size: .95rem;
    font-weight: 600;
    margin: 14px 0 8px;
  }
  pre {
    background: #0a1526;
    border: 1px solid #1e3a5f;
    border-radius: 8px;
    padding: 14px;
    color: #a8e6cf;
    font-size: .8rem;
    font-family: 'Courier New', monospace;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-x: auto;
    max-height: 420px;
    overflow-y: auto;
    line-height: 1.5;
  }
  .footer {
    text-align: center;
    color: #4a6c8f;
    font-size: .75rem;
    margin-top: 18px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>لوحة تحكم الشبكة المصغرة (Meraki Style)</h1>
  <p class="subtitle">إدارة ومراقبة الشبكات والأجهزة محلياً</p>
  <div class="bar">أمر مخصص (Custom Command)</div>

  <form method="post" action="/run">
    <label for="choice">اختر أمراً جاهزاً:</label>
    <select name="choice" id="choice">
      {% for c in commands %}
        <option value="{{ c }}" {% if c == selected %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>

    <label for="custom_cmd">أو اكتب أمراً يدوياً (يُستخدم فقط مع Custom Command):</label>
    <input type="text" name="custom_cmd" id="custom_cmd"
           placeholder="اكتب الأمر يدوياً (اختياري) إذا اخترت أمر مخصص..."
           value="{{ custom_cmd }}">

    <button type="submit">تنفيذ الأمر (Run)</button>
  </form>

  {% if output %}
    <div class="result-title">النتيجة: (Network Analytics)</div>
    <pre>{{ output }}</pre>
  {% endif %}

  <div class="footer">FastAPI + Jinja2 • localhost:8081</div>
</div>
</body>
</html>
